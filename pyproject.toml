[project]
name = "asanclip-rag"
version = "1.0.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -m 'not integration'"
markers = [
    "integration: tests that require GEMINI_API_KEY or external services",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app2", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = [
    "E501",
    "B008",   # FastAPI Depends() in defaults
    "BLE001", # broad except in health/scripts is intentional
    "LOG015", # root logger in lifespan is fine
    "RUF012", # class-level dict constants
    "S110",   # try-except-pass with fallback
    "S112",   # try-except-continue in batch scripts
    "SIM102", # nested if readability
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811", "E402"]
"scripts/*" = ["E402", "BLE001", "S110", "S112"]
"app2/monitoring/health.py" = ["BLE001", "B008"]
"app2/api/routes.py" = ["B008"]
"app2/main.py" = ["LOG015"]
