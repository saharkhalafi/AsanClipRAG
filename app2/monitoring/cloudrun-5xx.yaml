displayName: "AsanClip Cloud Run 5xx Errors"

combiner: OR

conditions:
- displayName: "5xx error rate > 5%"
  conditionThreshold:
    filter: >
      resource.type="cloud_run_revision"
      resource.labels.service_name="asanclip-api"
      metric.type="run.googleapis.com/request_count"
      metric.labels.response_code_class="5xx"

    aggregations:
    - alignmentPeriod: 300s
      perSeriesAligner: ALIGN_RATE

    comparison: COMPARISON_GT
    thresholdValue: 0.05
    duration: 300s

notificationChannels:
- projects/asanclip-rag-prod/notificationChannels/16725964553696422189

#gcloud alpha monitoring channels list --project=asanclip-rag-prod