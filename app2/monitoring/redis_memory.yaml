displayName: "AsanClip Redis Memory High"

combiner: OR

conditions:
- displayName: "Redis memory usage above 80%"
  conditionThreshold:
    filter: >
      resource.type="redis_instance"
      metric.type="redis.googleapis.com/stats/memory/usage_ratio"
    comparison: COMPARISON_GT
    thresholdValue: 0.8
    duration: 600s

notificationChannels:
- projects/asanclip-rag-prod/notificationChannels/16725964553696422189